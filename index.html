<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios - Sistema Beta v1.2.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SE BORRAN LOS COMENTARIOS-->
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-lg mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">📝 Registro de Usuarios</h2>
                <!-- SE BORRAN LA VERSIÓN DEL SISTEMA Y DATOS SENSIBLES -->
            </div>
            <div class="card-body">
                <form id="registroForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre(s)</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required pattern="[a-záéíóúñüA-ZÁÉÍÓÚÑÜ0-9]{3,}" minlength="3" title="Mínimo 3 caracteres. Solo letras (A-Z, a-z, á, é, í, ó, ú, ñ) y números (0-9).">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="apellido1" class="form-label">Primer Apellido</label>
                            <input type="text" class="form-control" id="apellido1" placeholder="Primer apellido" required pattern="[a-záéíóúñüA-ZÁÉÍÓÚÑÜ\s]{2,}" minlength="2" title="Mínimo 2 caracteres. Solo letras (A-Z, a-z, á, é, í, ó, ú, ñ) y espacios.">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="apellido2" class="form-label">Segundo Apellido</label>
                            <input type="text" class="form-control" id="apellido2" placeholder="Segundo apellido" required pattern="[a-záéíóúñüA-ZÁÉÍÓÚÑÜ\s]{2,}" minlength="2" title="Mínimo 2 caracteres. Solo letras (A-Z, a-z, á, é, í, ó, ú, ñ) y espacios.">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" placeholder="10 dígitos" required pattern="[0-9]{10}" minlength="10" maxlength="10" title="Exactamente 10 dígitos. Solo números (0-9).">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="curp" class="form-label">CURP</label>
                            <input type="text" class="form-control" id="curp" placeholder="18 caracteres" required pattern="[A-Z0-9]{18}" minlength="18" maxlength="18" title="Exactamente 18 caracteres. Solo letras mayúsculas (A-Z) y números (0-9).">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required title="Formato válido: usuario@dominio.com">
                        </div>
                    </div>
                     <!-- SE BORRAN LOS COMENTARIOS-->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            💾 Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="mt-4">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">📋 Registros Guardados</h3>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nombre Completo</th>
                                    <th>Teléfono</th>
                                    <th>CURP</th>
                                    <th>Correo</th>
                                </tr>
                            </thead>
                            <tbody id="tablaRegistros">
                                 <!-- SE BORRAN LOS COMENTARIOS-->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

     <!-- SE BORRAN LOS COMENTARIOS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
